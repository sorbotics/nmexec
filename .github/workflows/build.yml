name: Build Packages

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push Docker image to ACR"
        required: true
        default: "false"
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      HOME: /home/runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq git software-properties-common lrzip libmbedtls-dev gcc
          sudo add-apt-repository ppa:deadsnakes/ppa
          sudo apt-get install -yy python3.11 python3.11-venv python3.11-dev python3.11-distutils devscripts equivs python3-pip dos2unix

      - name: Validate required files
        run: |
          set -e
          test -f deb_build.sh
          test -d debian

      - name: Ensure build script is executable
        run: chmod +x deb_build.sh

      - name: Build Debian package
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
          HOME: /home/runner
        run: sudo ./deb_build.sh

      - name: List generated packages
        run: ls -lah *.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmexec-deb-package
          path: "*.deb"
          if-no-files-found: error

  build-rpm:
    runs-on: ubuntu-22.04

    container:
      image: registry.access.redhat.com/ubi9/python-311
      options: --user 0

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      HOME: /github/home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          yum --disableplugin=subscription-manager install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm \
            && yum update -y \
            && yum --disableplugin=subscription-manager install -y openssh-clients rpmlint rpm-build dpkg fakeroot jq gcc \
            && python3.11 -m pip install --upgrade pip wheel Cython uv

      - name: Validate required files
        run: |
          set -eux
          test -f rpm_build.sh
          test -f rpm/nmexec.spec

      - name: Make build script executable
        run: chmod +x rpm_build.sh

      - name: Build RPM package
        run: |
          set -euxo pipefail
          ./rpm_build.sh

      - name: List generated RPMs
        run: ls -lah *.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmexec-rpm-package
          path: "*.rpm"
          if-no-files-found: error

  release:
    runs-on: ubuntu-22.04
    needs: [build-deb, build-rpm]

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nmexec-*
          merge-multiple: true

      - name: Generate global checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f \( -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Prepare release variables
        id: relvars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Split assets above the GitHub size limit
        env:
          # GitHub rejects release assets of 2 GiB (2147483648 bytes) or more
          MAX_ASSET_BYTES: "2000000000"
          PART_SIZE: 1000M
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb *.rpm; do
            [ -e "$f" ] || continue
            if [ "$(stat -c %s "$f")" -ge "$MAX_ASSET_BYTES" ]; then
              split -b "$PART_SIZE" "$f" "$f.part-"
              rm "$f"
              # whole-file hash is already in checksums.txt (verifies the reassembled file); add one per part
              sha256sum "$f".part-* >> checksums.txt
            fi
          done
          cat checksums.txt
          ls -lah

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.part-*
            dist/checksums.txt
          generate_release_notes: false
          # keep notes written by hand on the release instead of overwriting them
          append_body: true
          body: |
            ## Packages

            This release includes:
            - Debian package (`.deb`) and RPM package (`.rpm`). A package larger than 2 GiB is split in `.part-aa`, `.part-ab`, ... pieces (GitHub limit per asset); join them with `cat`
            - `checksums.txt` with SHA256 hashes of the whole packages and of each piece

            ### Install on Debian/Ubuntu
            ```bash
            VERSION="${{ steps.relvars.outputs.version }}"
            # download the package, or all its pieces
            curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.relvars.outputs.tag }} \
              | grep -o '"browser_download_url": *"[^"]*nmexec_[^"]*_all\.deb[^"]*"' | cut -d'"' -f4 | xargs -n1 curl -fLO
            # join the pieces if there are any
            [ -e nmexec_${VERSION}_all.deb ] || cat nmexec_${VERSION}_all.deb.part-* > nmexec_${VERSION}_all.deb
            sudo apt install -y ./nmexec_${VERSION}_all.deb
            ```

            ### Install on RHEL9
            ```bash
            VERSION="${{ steps.relvars.outputs.version }}"
            curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.relvars.outputs.tag }} \
              | grep -o '"browser_download_url": *"[^"]*nmexec-[^"]*\.rpm[^"]*"' | cut -d'"' -f4 | xargs -n1 curl -fLO
            [ -e nmexec-${VERSION}-1.el9.x86_64.rpm ] || cat nmexec-${VERSION}-1.el9.x86_64.rpm.part-* > nmexec-${VERSION}-1.el9.x86_64.rpm
            sudo dnf install -y ./nmexec-${VERSION}-1.el9.x86_64.rpm
            ```

            ### Verify integrity
            Run it in the directory with the downloaded files (after joining the pieces):
            ```bash
            curl -fL -O https://github.com/${{ github.repository }}/releases/download/${{ steps.relvars.outputs.tag }}/checksums.txt
            sha256sum -c --ignore-missing checksums.txt
            ```
